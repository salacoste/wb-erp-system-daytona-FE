# OpenWiki Update — Frontend repo (salacoste/wb-erp-system-daytona-FE)
#
# Daily auto-update of agent documentation via z.ai GLM 5.2.
# Offset 1h from backend (09:00 UTC vs 08:00) to avoid concurrent API key usage.
#
# Uses the FE repo's self-hosted VPS runner (same as frontend-quality.yml).

name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    # 09:00 UTC daily (10:00 MSK).
    - cron: "0 9 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenWiki
        run: npm install --global openwiki

      - name: Run OpenWiki
        run: openwiki --update --print
        env:
          # z.ai GLM 5.2 via Anthropic-compatible endpoint.
          OPENWIKI_PROVIDER: anthropic
          ANTHROPIC_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
          OPENWIKI_MODEL_ID: glm-5.2

      - name: Commit OpenWiki updates
        run: |
          git config user.name "OpenWiki Bot"
          git config user.email "actions@github.com"
          git add openwiki/ CLAUDE.md || true
          if git diff --cached --quiet; then
            echo "No OpenWiki changes to commit."
          else
            git commit -m "docs: update OpenWiki agent documentation (z.ai GLM 5.2)"
            git push
            echo "✅ OpenWiki docs committed."
          fi
