# Frontend Quality Gates Pipeline
#
# CI guard for the Next.js frontend (this repo: salacoste/wb-erp-system-daytona-FE).
# Runs on every push to main/develop. Uses the dedicated external runner at 188.245.163.220.
#
# Architecture: SINGLE JOB with sequential steps. The VPS has 2 vCPU / 4 GB RAM + 4 GB swap.
# Sequential steps share one node_modules install; Vitest uses both CPUs without duplicating npm ci.
#
# Key Node.js memory settings:
#   - tsc: --max-old-space-size=1536 (type-check is memory-hungry)
#   - vitest: default heap (tests are lighter)
#
# See:
#   - CLAUDE.md (Critical Development Rules — Mandatory section)
#   - eslint.config.js (flat config — the enforcement path)
#   - .eslintrc.json (documentation/IDE integration only)

name: Frontend Quality Gates

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: frontend-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gates
    runs-on: [self-hosted, Linux, X64, wb-ci-fe]
    # Full Vitest suite can exceed 30 min on the 2 vCPU self-hosted runner.
    # The self-hosted runner can also spend 20+ minutes in the runner/host lock
    # before test execution starts, so keep the job timeout above test runtime.
    timeout-minutes: 90

    env:
      NODE_ENV: test
      TZ: Europe/Moscow

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Pin canonical npm runtime
        run: |
          npm install --global npm@11.11.0
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.11.0"

      - name: Install dependencies
        run: npm ci

      # ── Step 1: ESLint (flat config) ──────────────────────────────────────
      - name: Run ESLint
        run: npm run lint

      # ── Step 2: TypeScript type-check ─────────────────────────────────────
      # tsc --noEmit needs ~1.2 GB heap on this codebase. The VPS has 4 GB RAM
      # + 4 GB swap, so --max-old-space-size=1536 fits comfortably.
      - name: Run TypeScript type-check
        run: node --max-old-space-size=1536 ./node_modules/.bin/tsc --noEmit

      # ── Step 3: Full Unit Suite + Governed Coverage (Vitest) ─────────────
      - name: Validate coverage governance helpers
        run: npm run test:coverage:governance

      - name: Run full Vitest suite with governed coverage
        run: npm run cert:coverage:ci -- --output-dir coverage/ci

      - name: Upload governed coverage evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: frontend-governed-coverage
          path: coverage/ci
          if-no-files-found: error

      # ── Step 4: Privacy Guard ─────────────────────────────────────────────
      # Forbid console.* in PII files (Story 86.2 / Epic 86-FE retro #7)
      - name: Scan PII files for forbidden console.* calls
        run: |
          set -euo pipefail
          PII_GLOBS=(
            "src/lib/api/orders/client-info-api.ts"
            "src/lib/api/orders/__tests__/client-info-api.test.ts"
            "src/hooks/useClientInfo.ts"
            "src/hooks/__tests__/useClientInfo.test.ts"
            "src/types/orders-client-info.ts"
            "src/components/custom/orders/__tests__/OrdersTable.client-column.test.tsx"
          )
          EXISTING=()
          for f in "${PII_GLOBS[@]}"; do
            [ -f "$f" ] && EXISTING+=("$f")
          done

          if [ ${#EXISTING[@]} -eq 0 ]; then
            echo "ℹ️  No PII files found — guard skipped"
            exit 0
          fi

          echo "Scanning ${#EXISTING[@]} PII file(s):"
          printf '  - %s\n' "${EXISTING[@]}"

          if grep -nE 'console\.(log|info|debug|warn|error|trace|dir|table|count|group|groupEnd|time|timeEnd|timeLog|profile|profileEnd)\s*\(' "${EXISTING[@]}"; then
            echo ""
            echo "::error::PRIVACY VIOLATION — forbidden console.* call found in a PII file"
            exit 1
          fi

          echo "✅ No forbidden console.* calls in PII files"
