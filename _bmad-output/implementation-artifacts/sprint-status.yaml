  164.1-fe-api-interceptor-error-path-tests: done # Story 164.1-FE / FR9 — PURE TEST ADDITION (0 production-code change; git diff main...HEAD -- src/lib/api-interceptors.ts src/lib/api-client.ts src/types/api.ts empty). New src/lib/__tests__/api-interceptors.test.ts (+87 direct unit tests) covers every exported helper in src/lib/api-interceptors.ts + the api-client integration path: extractErrorMessage (17 tests: nested/flat/precedence/text/empty/malformed/hostile circular+deep+null+number+boolean+undefined — never throws), parseRetryAfter (18: accept 1/30/600/whitespace-padded, reject 0/-1/1.5/empty/ws-only/HTTP-date/601/NaN/abc/12e2/+30/null/undefined), extractRetryAfter (28: 429/503 gating, 502/500 reject, header>body precedence x2, numeric+string+ws body fallback, isJson=false/null/non-object body ignore, numeric-body rejections 0/-5/601/±Inf/NaN, numeric-decimal 1.5→floor 1 documented, string-body regex rejections, out-of-range-header→valid-body fallthrough x2), isExpectedWbTokenError (7: only exact 401+"WB API token" true; 401-no-phrase / "WB token" near-miss / 403 / 500 / case-variant false), trackTelegramApiError (4) + trackTelegramNetworkError (2): called-for-/notifications/, not-called for unrelated + "notif" substring guard), logApiError (6: JSON→JSON.stringify, raw→passthrough, WB-token suppression independent for JSON+non-JSON, 401-no-phrase + 500-w-phrase not suppressed), ApiClient integration (6: real ApiError rethrown as-is not reclassified as status:0 network, generic exception wrapped status:0, default network logging+tracking fires, suppressNetworkErrorLog suppresses logger+Telegram but error still propagates, /notifications/ network tracked when not suppressed, suppressed when flag set). Anti-patterns: #3 real ApiError ctor, #4 subset interface + as-unknown-as bridges (no as any), mockRejectedValueOnce for one-shot fetch errors. Gates: tsc 0 / eslint 0 / locale 4 (unchanged) / docs 18 (unchanged) / vitest 17694 pass (+87 over 17607 floor) / fmt clean. NO real interceptor bug surfaced — 3 initial test-expectation mismatches (string-under-isJson returned verbatim not fallback; numeric-body decimal 1.5 floored to 1 per Math.floor; helper name isExpectedWbTokenError not Exception) were test-side corrections to match documented behavior, not production defects. **Lessons:** (1) extractErrorMessage's string branch is isJson-independent — any typeof==='string' body returns verbatim even under isJson=true. (2) Retry-After numeric-body path floors decimals (1.5→1) while string-body regex rejects them — asymmetric by design. (3) The interceptor module lives at src/lib/api-interceptors.ts (sibling of api-client.ts), NOT under src/lib/api/ — story brief's path hint was approximate.
  164.2-fe-typed-recharts-tooltip-boundary: done # Story 164.2-FE / FR14 — TYPED RECHARTS TOOLTIP ADAPTER (behavior-preserving type-safety refactor). Eliminates the production `RegionalTooltip as any` cast on `<Tooltip content={...} />` (CLAUDE.md anti-pattern #4) in src/app/(dashboard)/analytics/fbs-enhanced/components/FbsRegionalDataSection.tsx. Approach chosen: NARROW TYPED ADAPTER (NOT props-implement-Recharts-type) — because recharts 3.4.1 `TooltipContentProps.payload` is typed `ReadonlyArray<any>` (verified via npm pack recharts@3.4.1 → types/component/Tooltip.d.ts:4), so directly implementing that interface would still leak `any` into the presentational component (violates AC #1 / anti-pattern #4). New sibling src/app/(dashboard)/analytics/fbs-enhanced/components/RegionalTooltip.tsx exports (1) `RegionalTooltip` pure presentational component (byte-identical to pre-extraction impl; pinned by the existing direct unit tests in FbsRegionalDataSection.test.tsx which stay green) + (2) `regionalTooltipContent` typed adapter whose param is `TooltipContentProps<ValueType, NameType>` (public recharts export; ValueType/NameType NOT re-exported so inlined as `number|string|ReadonlyArray<number|string>` / `number|string` to match the broadened shape `<Tooltip content>` resolves to — assignable without cast). Adapter owns normalization: narrows the opaque payload via runtime guards (`isRawTooltipEntry`, `isRegionalRowRaw`) and forwards ONLY {name, color, value} to RegionalTooltip — unsupported members (dataKey, type, unit, nested junk) do NOT leak (AC #2). FbsRegionalDataSection.tsx now `<Tooltip content={regionalTooltipContent} />` (no cast, no eslint-disable); `RegionalTooltip` re-exported from FbsRegionalDataSection.tsx to keep the historical test-import path stable. ZERO-vs-NULL (AC #3 / anti-pattern #8): chart plots `percentage = r.percentage ?? 0` (library needs a number), so a missing % surfaces in entry.value as 0; adapter reads the PRESERVED raw `entry.payload._percentageRaw` (written by FbsRegionalDataSection since Epic 129 but NEVER read before — dead data now wired) — genuine 0 → formatPercentage(0) → "0 %", null/missing → "—" (0 stays distinguishable from missing; no `?? 0` on the % value). Rendering byte-identical for every code path the existing tests pin (label/name/color/formatPercentage unchanged, Russian-locale formatPercentage preserved, chart independent empty-state untouched — AC #4). Field access preserved exactly: before RegionalTooltip read payload[i].{name,value,color}; after RegionalTooltip reads entries[i].{name,value,color} (adapter-constructed, same field names/types) + adapter reads entry.{name,color,value,payload._percentageRaw}. Tests: new __tests__/RegionalTooltip.test.tsx (+9 adapter tests, no `any`) covers inactive / empty / null / all-malformed / populated / ZERO-vs-NULL (0→"0 %" distinct from null→"—") / _percentageRaw-absent fallback to plotted value / NO-LEAK (dataKey+type+unit+nested junk absent from DOM) / typed-entry contract; existing FbsRegionalDataSection.test.tsx direct RegionalTooltip tests (populated, null→"—", inactive/empty→null) stay green. Anti-patterns: #4 (no as any / no as-casts on data — narrowing via runtime guards + isRawTooltipEntry subset interface), #8 (null→"—", 0 preserved). Gates: tsc 0 / eslint 0 (0 warning) / locale 4 (unchanged, baseline held — formatPercentage reuse) / docs 18 (unchanged) / vitest 17703 pass (+9 over 17694 floor) / fmt clean. ZERO executable `as any` in either source file (only 3 comment-prose references to the removed cast remain). **Lessons:** (1) recharts 3.4.1 types `TooltipContentProps.payload` as `ReadonlyArray<any>` — implement it directly and `any` still leaks; use a runtime-guard adapter. (2) `<Tooltip content>` uses non-exported `ValueType/NameType` — inline the broadened union or the adapter won't assign cast-free. (3) Epic 129 wrote `_percentageRaw` but never read it — null % rendered as 0; this wires it so null→"—".
  164.3-fe-tariff-markers-fallback-warning-dedup: done # Story 164.3-FE / FR14 — STALE-MARKER CLEANUP + BOUNDED FALLBACK-WARNING DEDUP (calculation results byte-identical; only the warning-emit pattern changed). AC#1 stale markers: removed "STUB FILE - TDD Red Phase" / "placeholder functions" / "Functions (STUB - to be implemented)" from src/lib/tariff-extraction-utils.ts (the ONLY tariff SOURCE file with them; header now documents current fallback rules + data-source semantics accurately). Price-calculator/hook TEST files' "TDD Red Phase" headers are legitimate test docs and left intact per AC#1. AC#2/#3 dedup utility: new src/lib/tariff-fallback-diagnostics.ts (137 lines, under cap) exports TariffFallbackDiagnostics class + storageFallbackDiagnostics singleton + resetStorageFallbackDiagnosticsForTests. (a) WITHIN one calc: record({reason}) per fallback row + flush() emits ONE logger.warn aggregate diagnostic with COUNT + bounded non-sensitive reason sample (MAX_SAMPLE=5; signature = "count|sorted-unique-reasons", order-independent). (b) ACROSS renders: identical snapshot signature deduped via bounded Set (MAX_SNAPSHOTS=32, FIFO eviction of oldest -> store cannot grow unbounded); only a materially changed snapshot (count OR reason multiset differs) re-emits. (c) reset() clears BOTH in-flight collection AND cross-call store for deterministic tests. AC#4 caller separation: ONLY the aggregate supply lookup (src/hooks/supply-tariffs-lookup.ts extractSupplyWarehouses) routes through the diagnostics singleton with {warn:false} per-row + flush() tail-call (emits ONE aggregate diagnostic). getTariffsByBoxTypeFromCoefficients (box-type view) EXPLICITLY SUPPRESSES the per-call warn via its own {warn:false} AND emits NO aggregate diagnostic either (neither per-row nor aggregate) — a pre-existing opt-out, AC#4-compliant (warn retained by default; suppression is opt-in), out of scope for the warning-dedup story. Bare extractStorageTariffs (no options) RETAINS its direct per-call logger.warn by default. Review-fix (Story 164.3-FE review): corrected the prior FALSE doc claim that the box-type path "retains direct warn" — it actually explicitly suppresses via {warn:false}; locked with a new falsifiable box-type-suppression test (logger.warn NOT called when baseLiterRub=0; fails if {warn:false} removed). AC#5 tests: new src/lib/__tests__/tariff-fallback-diagnostics.test.ts (+13 tests) locks (a) N rows -> exactly ONE warn (not N), (b) identical snapshot -> no re-emit, (c) materially changed snapshot -> new emit, (d) reset() clears state, (f) sample cap MAX_SAMPLE + snapshot-store cap MAX_SNAPSHOTS FIFO; src/lib/__tests__/tariff-extraction-utils.test.ts +5 tests pin the new optional fallbackReason discriminator ('empty-response'|'base-zero') consumed by the aggregate path + that the DIRECT path still warns per-call by default; src/hooks/__tests__/supply-tariffs-lookup.test.ts rewritten warning-count assertions (logger.debug -> logger.warn, sample shape {warehouseId,warehouseName} -> {reasons}) — calculation RESULT assertions (storageBaseLiterRub===0.11 fallback, usingStorageFallback, warehouse counts, boxType preference, missing-rate exclusion) byte-identical green. Added optional fallbackReason to StorageTariffExtraction (additive, non-breaking). Tariff CALCULATION outputs byte-identical: numeric fallback values (DEFAULT_STORAGE_TARIFFS 0.11/0.11), coefficient preservation (incl -1), pallet zero-additional-rate all unchanged — proven by StorageTariffFix.story-44.41.test.ts + useSupplyTariffs.storage.test.ts + storage-cost-utils.* staying green without touching their assertions. Anti-patterns: #8 NOT in play (counts not money/ratio; sample is reason strings not raw data), no as-any on data (fallbackReason is a string-literal union discriminator), mockRejectedValueOnce not used here (no async), vi.spyOn(logger,'warn'/'debug') with beforeEach reset. Gates: tsc 0 / eslint 0 (0 warning) / locale 4 (unchanged) / docs 18 (unchanged) / vitest 17720 pass (+17 over 17703 floor) / fmt clean. Scope NOTE: eslint --max-warnings change is Story 164.4 — NOT touched here. **Lessons:** (1) The aggregate dedup already half-existed inline in supply-tariffs-lookup.ts (loggedStorageFallbackSummaries Set + resetStorageFallbackLogDedupForTests) but at logger.debug level leaking warehouseName into the signature — extracting it to a testable utility + moving to logger.warn + non-sensitive reason codes is the real delta. (2) Adding an optional fallbackReason discriminator to StorageTariffExtraction is the clean bridge between the extractor and the diagnostics accumulator — avoids re-deriving the fallback branch at the call site. (3) Snapshot signature must be order-independent (sorted unique reasons) or row ordering in a Map iteration produces false material-change re-emits.
  164.4-fe-package-metadata-zero-warning-lint: done # Story 164.4-FE / FR14 — PACKAGE-METADATA AUDIT + ZERO-WARNING LINT POLICY. AUDIT RESULT: AC#1 NO-OP (already clean) — `npm ls react react-dom` / `npm ls react-dom @types/react-dom` show exactly ONE required root runtime declaration each (react@19.2.7, react-dom@19.2.7) and ONE dev declaration (@types/react-dom@19.2.3); transitive peer refs (react@19.2.7 deduped, react-dom@19.2.7 deduped, @types/react-dom@19.2.3 deduped) correctly deduped to the single root, NOT misclassified as duplicate root deps. AC#2 NO-OP (no regen needed) — no package.json dependency fields changed (only script strings + doc text), so `npm install --package-lock-only` (pinned npm 11.11.0) produces ZERO lockfile churn (verified: byte-identical package-lock.json). AC#3 CHANGE: the obsolete `--max-warnings 112` allowance lived ONLY in package.json scripts `lint` + `lint:fix` (no budget in eslint.config.js / .eslintrc.json / no .lintstagedrc files; lint-staged already `--max-warnings=0`); replaced both with `--max-warnings 0`. Pre-change bare `npx eslint 'src/**/*.{ts,tsx}'` already reported 0 problems (exit 0), so enforcing 0 does not break the gate. AC#4 passed: npm ls --all exit 0 (valid tree), npm audit reports 3 PRE-EXISTING transitive advisories (1 moderate postcss <=8.5.22 / 2 high brace-expansion 4.0.0-5.0.8 + js-yaml 4.0.0-4.3.0) — all dev/build-time, none introduced by this change, none fixed (npm audit fix would rewrite the lockfile = forbidden churn per AC#2; postcss already pinned to 8.5.23 via the next.postcss override which is the fix for the <=8.5.22 advisory). No runtime dependency or product behavior removed. Doc alignment: CLAUDE.md Accepted-Baselines ESLint row + Drift-rules paragraph updated to state the zero-warning policy (was generic "within the script's explicit budget"); historical 112 references in closed sprint-status rows / retros / epic plans left intact per APPEND-ONLY convention. Gates: tsc 0 / lint 0 (zero-warning policy) / bare eslint 0 problems / locale 4 (==baseline) / docs 18 (==baseline) / fmt clean / vitest 17721 pass (1069 files, +535 over 17186 floor) / BUILD 0. **Lessons:** (1) The "112 allowance" had already been passively retired by prior warning-fix stories (164.1-164.3) — the budget was a stale ceiling above an actual-0 count, so this story is mostly the policy flip from `--max-warnings 112` to `--max-warnings 0`, not a warning-reduction story. (2) `npm ls` "deduped" arrows are the CORRECT signal (single root hoisted to transitive consumers), not a duplicate-root misclassification — verify with the flat `npm ls <pkg>` form which lists only root-level declarations. (3) Changing only package.json script strings cannot perturb the dep tree, so AC#2's lockfile-regen check is a no-op confirmation (`cp before; npm i --package-lock-only; diff` = empty) rather than a regen step.

